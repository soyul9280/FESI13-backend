services:
  app:
    image: ${DOCKER_IMAGE}
    container_name: fesi13-app
    restart: unless-stopped
    ports:
      - "8080:8080"
    logging:
      driver: awslogs
      options:
        awslogs-region: ap-northeast-2
        awslogs-group: /fesi13/app
        awslogs-stream: fesi13-app
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DB_URL: ${DB_URL}
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      JWT_ACCESS_EXPIRATION: ${JWT_ACCESS_EXPIRATION}
      JWT_REFRESH_EXPIRATION: ${JWT_REFRESH_EXPIRATION}
      KAKAO_CLIENT_ID: ${KAKAO_CLIENT_ID}
      KAKAO_CLIENT_SECRET: ${KAKAO_CLIENT_SECRET}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}
      ADMIN_REPAIR_SECRET: ${ADMIN_REPAIR_SECRET}
      IMAGE_UPLOAD_DIR: /app/data/images
      APP_BASE_URL: https://sailmate.store
    volumes:
      - app_images:/app/data/images

volumes:
  app_images:
